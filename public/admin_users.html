<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználók Kezelése - Hibabejelentő</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin_users.css">
</head>

<body>
    <nav class="navbar navbar-custom px-4 py-2"> <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand text-uppercase tracking-tighter">
            <span class="fw-800">Bugs</span><span class="fw-300">Begone</span>
        </span>

        <div class="status-center text-white" id="userStatusDisplay">
          <span id="userInfo">Betöltés...</span>
        </div>

        <div class="d-flex align-items-center gap-3">
          <a href="help.html" target="_blank" class="gyik-link">GYIK</a>
          <button id="logoutButton" class="btn-logout">Kijelentkezés</button>
        </div>
    </div>
  </nav>

    <div class="container-fluid">
        <div id="adminContent" style="display: none;">
            <div class="dashboard-container">
                <aside class="custom-card">
                    <h4 class="mb-4">Új felhasználó hozzáadása</h4>
                    <form id="newUserForm">
                        <div class="mb-3">
                            <label class="form-label">Név</label>
                            <input type="text" class="form-control" id="newUserName" placeholder="Teljes név" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Felhasználónév</label>
                            <input type="text" class="form-control" id="newUserUsername" placeholder="Felhasználónév" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jelszó</label>
                            <input type="password" class="form-control" id="newUserPassword" placeholder="Jelszó" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Szerepkör</label>
                            <select class="form-select" id="newUserRole" required>
                                <option value="tanar">Tanár</option>
                                <option value="karbantarto">Karbantartó</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" style="background-color: #071F65;">Felhasználó hozzáadása</button>
                        <div id="newUserError" class="text-danger mt-2"></div>
                    </form>
                </aside>

                <main class="custom-card table-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="m-0">Felhasználók</h4>
                        <select id="filterRole" class="form-select w-auto">
                            <option value="">Összes szerepkör</option>
                            <option value="tanar">Tanár</option>
                            <option value="karbantarto">Karbantartó</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div id="userListError" class="text-danger mb-3"></div>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Név</th>
                                    <th>Felhasználónév</th>
                                    <th>Szerepkör</th>
                                    <th>Műveletek</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Felhasználók itt jelennek meg -->
                            </tbody>
                        </table>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <div id="accessDenied" class="alert alert-danger" style="display: none; margin: 2rem;">
        Nincs jogosultságod ennek az oldalnak a megtekintéséhez. <a href="main.html">Vissza a főoldalra</a>.
    </div>

    <footer>
        <div>Minden jog fenntartva BugsBegone© 2026</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin_users.js"></script>
</body>
</html>
