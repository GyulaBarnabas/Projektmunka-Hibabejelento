<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hibabejelentő Rendszer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <nav class="navbar navbar-custom"> <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand text-uppercase tracking-tighter">
            <span class="fw-800">Bugs</span><span class="fw-300">Begone</span>
        </span>

        <div class="status-center text-white" id="userStatusDisplay">
          <span id="userInfo">Betöltés...</span>
        </div>

        <div class="d-flex align-items-center gap-3">
          <a href="help.html" target="_blank" class="gyik-link">GYIK</a>
          <button id="logoutButton" class="btn-logout">Kijelentkezés</button>
        </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="dashboard-container">     
      <aside class="custom-card">
          <h4 class="mb-4">Új hiba bejelentése</h4>
            <form id="newFaultForm">
                <div class="mb-3">
                    <label class="form-label">Terem / Helyszín</label>
                    <input type="text" class="form-control" id="newTerem" placeholder="Pl: 204-es terem" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Leírás</label>
                    <textarea class="form-control" id="newLeiras" rows="4" placeholder="Mi a probléma?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2" style="background-color: #071F65;">Küldés</button>
                <div id="newFaultError" class="text-danger mt-2"></div>
            </form>
        </aside>

        <main class="custom-card table-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="m-0">Hibajegyek</h4>
                <select id="filterStatus" class="form-select w-auto">
                    <option value="">Összes állapot</option>
                    <option value="bejelentve">Bejelentve</option>
                    <option value="kijavítva">Kijavítva</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                  <thead>
                      <tr>
                          <th>Terem</th>
                          <th>Leírás</th>
                          <th>Állapot</th>
                      </tr>
                  </thead>
                  <tbody id="faultsTableBody">
                      </tbody>
                </table>
            </div>
      </main>
    </div>
  </div>

  <footer>
    <div>Minden jog fenntartva BugsBegone© 2026</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main-app.js"></script>
</body>

</html>
