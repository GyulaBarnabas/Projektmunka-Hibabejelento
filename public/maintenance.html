<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hibabejelentő Rendszer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/maintenance.css">
</head>

<body>
  <nav class="navbar navbar-custom">
      <div class="container-fluid d-flex justify-content-between align-items-center">
          <span class="navbar-brand text-uppercase tracking-tighter">
              <span class="fw-800">Bugs</span><span class="fw-300">Begone</span>
          </span>
          <div class="status-center text-white" id="userStatusDisplay">
            <span id="userInfo">Betöltés...</span>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div id="adminUsersLinkContainer" style="display: none;">
              <a href="admin_users.html" class="gyik-link">Felhasználók</a>
            </div>
            <a href="help.html" target="_blank" class="gyik-link">GYIK</a>
            <button id="logoutButton" class="btn-logout">Kijelentkezés</button>
          </div>
      </div>
  </nav>

  
  <main class="maintenance-page">
    <div class="container maintenance-shell mt-4">
    <div class="maintenance-topbar mb-3">
      <div class="section-heading">
        <h1>Javítandó hibák</h1>
      </div>
      <div class="maintenance-filter-box">
        <label for="filterStatus" class="form-label maintenance-filter-label">Szűrés:</label>
        <select id="filterStatus" class="form-select maintenance-select">
          <option value="">Összes</option>
          <option value="bejelentve">Bejelentve</option>
          <option value="kijavítva">Kijavítva</option>
        </select>
      </div>
    </div>

    <section class="maintenance-table-card">
      <div class="table-responsive">
        <table class="table table-striped table-hover maintenance-table">
        <thead>
          <tr>
            <th>Dátum</th>
            <th>Terem</th>
            <th>Leírás</th>
            <th>Állapot</th>
            <th>Bejelentő</th>
            <th>Javító</th>
            <th>Mikor</th>
            <th>Műveletek</th>
          </tr>
        </thead>
        <tbody id="faultsTableBody">
          <!-- Hibák ide töltődnek be dinamikusan -->
        </tbody>
        </table>
      </div>
    </section>
    </div>
  </main>

  <footer>
    <div>Minden jog fenntartva BugsBegone© 2026</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main-app.js"></script>
</body>

</html>
